<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Walls">
  <title>Walls</title>
  <!-- Walls: un muro de ladrillos (las secciones del contrato) y uno destacado, la cláusula que buscas. -->
  <rect width="64" height="64" rx="16" fill="#F2A93B"/>
  <g fill="#FFFFFF">
    <rect x="10" y="14" width="20" height="10" rx="2.5"/><rect x="33" y="14" width="21" height="10" rx="2.5"/>
    <rect x="10" y="27" width="9" height="10" rx="2.5"/><rect x="45" y="27" width="9" height="10" rx="2.5"/>
    <rect x="10" y="40" width="20" height="10" rx="2.5"/><rect x="33" y="40" width="21" height="10" rx="2.5"/>
  </g>
  <rect x="22" y="27" width="20" height="10" rx="2.5" fill="#1B2340"/>
  <rect x="26" y="31" width="12" height="2" rx="1" fill="#FFD43B"/>
</svg>
