<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="HeliOS">
  <title>HeliOS</title>
  <!-- El sol con la curva de producción de un día grabada dentro (logo v2; el anterior está en helios-logo-v1.svg) -->
  <defs>
    <radialGradient id="helios-sun" cx="38%" cy="30%" r="75%">
      <stop offset="0" stop-color="#ffe2a8"/><stop offset=".5" stop-color="#ffb547"/><stop offset="1" stop-color="#ff7a3d"/>
    </radialGradient>
    <clipPath id="helios-disc"><circle cx="32" cy="32" r="29"/></clipPath>
  </defs>
  <circle cx="32" cy="32" r="29" fill="url(#helios-sun)"/>
  <path clip-path="url(#helios-disc)" d="M0 41 H14 C22 41 23 20 32 20 C41 20 42 41 50 41 H64" fill="none" stroke="#0b1220" stroke-width="4.4" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
