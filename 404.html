<!doctype html>
<html lang="es" data-lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Página no encontrada · Patricio Abarca</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
/* same tokens as the main page (light + dark) */
:root{--bg:#F3F5F7;--surface:#FFFFFF;--ink:#13202B;--muted:#5A6873;--line:#D9DFE4;--sun:#C9780A;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0E151B;--surface:#151F27;--ink:#E8EDF1;--muted:#97A5B0;--line:#26333D;--sun:#F2A93B;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0E151B;--surface:#151F27;--ink:#E8EDF1;--muted:#97A5B0;--line:#26333D;--sun:#F2A93B;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "Instrument Sans","Segoe UI",system-ui,sans-serif;display:grid;place-items:center;padding:16px}
html[data-lang="es"] [lang="en"],html[data-lang="en"] [lang="es"]{display:none!important}
main{max-width:520px;text-align:center}
.eyebrow{font:500 12px "JetBrains Mono",ui-monospace,Consolas,monospace;letter-spacing:.12em;text-transform:uppercase;color:var(--sun)}
h1{font:800 clamp(34px,8vw,56px)/1 "Bricolage Grotesque","Segoe UI",system-ui,sans-serif;letter-spacing:-.03em;margin:12px 0 14px}
p{color:var(--muted);margin:0 0 24px}
a.btn{display:inline-flex;font-weight:600;text-decoration:none;padding:12px 18px;border-radius:10px;background:var(--ink);color:var(--bg)}
a.btn:focus-visible{outline:2px solid var(--sun);outline-offset:3px}
</style>
</head>
<body>
<main>
  <div class="eyebrow">404</div>
  <h1><span lang="es">Esta página no existe</span><span lang="en">This page doesn’t exist</span></h1>
  <p><span lang="es">El enlace puede estar roto o la página se movió.</span><span lang="en">The link may be broken or the page has moved.</span></p>
  <a class="btn" href="/"><span lang="es">Ir a la portada de Patricio Abarca →</span><span lang="en">Go to Patricio Abarca’s home page →</span></a>
</main>
<script>
// same language choice as the main page: saved choice first, then the browser language
(function(){
  var l=null; try{l=localStorage.getItem('pa-lang');}catch(e){}
  if(l!=='es'&&l!=='en'){l=(navigator.language||'es').toLowerCase().indexOf('es')===0?'es':'en';}
  document.documentElement.setAttribute('data-lang',l); document.documentElement.lang=l;
})();
</script>
</body>
</html>
